<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏乐园 · 我的游戏网站</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 顶部：logo + 搜索 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">游戏乐园<span class="logo-sub">GAME ZONE</span></a>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜索游戏名称 / 简介..." />
      </div>
    </div>
  </header>

  <!-- 分类导航 -->
  <nav class="category-nav" id="categoryNav"></nav>

  <main>
    <!-- 最近玩过 -->
    <section class="section hidden" id="recentSection">
      <h2 class="section-title">最近玩过</h2>
      <div class="scroll-row" id="recentList"></div>
    </section>

    <!-- 我的收藏 -->
    <section class="section hidden" id="favSection">
      <h2 class="section-title">我的收藏</h2>
      <div class="scroll-row" id="favList"></div>
    </section>

    <!-- 全部游戏 -->
    <section class="section">
      <h2 class="section-title" id="sectionTitle">全部游戏</h2>
      <div class="game-grid" id="gameGrid"></div>
      <div class="empty hidden" id="emptyState">暂时没有找到匹配的游戏</div>
    </section>
  </main>

  <footer class="site-footer">
    游戏乐园 · 我的游戏网站 — 先在电脑上打开 index.html 即可体验
  </footer>

  <script src="data/games.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
