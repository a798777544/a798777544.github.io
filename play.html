<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏 · 游戏乐园</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 播放页顶部工具条 -->
  <header class="play-bar" id="playBar">
    <button class="bar-btn" id="backBtn">← 返回</button>
    <div class="play-title">
      <span id="gameTitle">游戏</span>
      <span class="game-tag" id="gameTag"></span>
    </div>
    <div class="play-actions">
      <button class="bar-btn" id="favBtn">☆ 收藏</button>
      <button class="bar-btn" id="fullBtn">⛶ 全屏</button>
    </div>
  </header>

  <!-- 全屏横屏提示层 -->
  <div class="fs-start-overlay" id="startOverlay">
    <div class="fs-start-card">
      <div class="fs-start-title">开始沉浸游玩</div>
      <p class="fs-start-desc">点击进入全屏，横屏体验会更舒适。</p>
      <button class="bar-btn primary-action" id="startBtn">点击进入全屏</button>
      <button class="bar-btn ghost" id="skipBtn">暂不全屏</button>
    </div>
  </div>

  <!-- 退出全屏恢复提示 -->
  <div class="fs-exit-toast hidden" id="exitToast">已退出全屏，回到浏览模式</div>

  <!-- 游戏播放区域（横屏沉浸） -->
  <main class="play-main" id="playMain">
    <div class="player" id="playerBox"></div>
  </main>

  <script src="data/games.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
