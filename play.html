<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏 · 游戏乐园</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 播放页顶部工具条 -->
  <header class="play-bar">
    <button class="bar-btn" id="backBtn">← 返回</button>
    <div class="play-title">
      <span id="gameTitle">游戏</span>
      <span class="game-tag" id="gameTag"></span>
    </div>
    <div class="play-actions">
      <button class="bar-btn" id="favBtn">☆ 收藏</button>
      <button class="bar-btn" id="fullBtn">⛶ 全屏</button>
    </div>
  </header>

  <!-- 游戏播放区域（横屏沉浸） -->
  <main class="play-main">
    <div class="player" id="playerBox"></div>
  </main>

  <script src="data/games.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
